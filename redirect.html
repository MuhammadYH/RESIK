<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/assets/icons/resik-favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #2E7D32;
      --green-light: #E8F5E9;
      --text: #1a1a1a;
      --muted: #757575;
      --bg: #F9FBF9;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .wrap {
      text-align: center;
      padding: 2rem;
    }

    /* Spinner */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--green-light);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .sub {
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* Error state */
    .error-state { display: none; }
    .error-state.visible { display: block; }
    .loading-state.hidden { display: none; }

    .error-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #C62828;
      margin-bottom: 0.5rem;
    }

    .error-msg {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .btn-back {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background: var(--green);
      color: white;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <!-- Loading State -->
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <p class="title">Memeriksa sesi…</p>
      <p class="sub" id="statusMsg">Mohon tunggu sebentar</p>
    </div>

    <!-- Error State -->
    <div class="error-state" id="errorState">
      <div class="error-icon">⚠️</div>
      <p class="error-title" id="errorTitle">Akses Ditolak</p>
      <p class="error-msg" id="errorMsg">Sesi tidak valid atau role tidak ditemukan.</p>
      <a href="/login.html" class="btn-back">Kembali ke Login</a>
    </div>
  </div>

  <!-- Load session & redirect logic -->
  <script src="/assets/js/resik-supabase.js"></script>
  <script src="/assets/js/session.js"></script>
  <script src="/assets/js/redirect.js"></script>

</body>
</html>
