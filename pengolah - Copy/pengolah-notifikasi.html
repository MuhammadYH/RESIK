  <!-- MAIN -->
  <main class="admin-main">

    <div class="admin-content">

        <!-- Tabs + Mark All -->
        <div class="notif-tabs-bar">
          <div class="admin-tabs" style="margin-bottom:0;border-bottom:none;">
            <button class="admin-tab active" data-tab="semua" onclick="filterNotif(this,'semua')">Semua</button>
            <button class="admin-tab" data-tab="belum" onclick="filterNotif(this,'belum')">Belum Dibaca <span class="nav-badge" style="position:static;transform:none;margin-left:4px;">2</span></button>
            <button class="admin-tab" data-tab="dibaca" onclick="filterNotif(this,'dibaca')">Dibaca</button>
          </div>
          <button class="notif-mark-all" id="btn-mark-all" onclick="markAllRead()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Tandai semua sebagai dibaca

        </div>

        <!-- List header -->
        <div class="notif-list-header">
          <span>Notifikasi</span>
          <span>Waktu</span>

        <!-- Notif list -->

        <div class="notif-footer">

<script src="/assets/js/pengolah-sidebar.js"></script>
<script>
const NOTIFS = [
  {
    id:1, read:false, type:'stok',
    icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>',
    iconBg:'background:var(--accent-orange-soft);color:var(--accent-orange)',
    title:'Stok Kompos Padat Hampir Habis',
    desc:'Stok kompos padat tersisa 45 kg — di bawah batas minimum 100 kg. Segera lakukan produksi batch baru.',
    time:'5 menit lalu'
  },
  {
    id:2, read:false, type:'buyer',
    icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    iconBg:'background:var(--accent-blue-soft,#E3F2FD);color:var(--accent-blue,#1976D2)',
    title:'Permintaan Baru dari CV Agro Makmur',
    desc:'CV Agro Makmur mengajukan permintaan 500 kg kompos padat untuk pengiriman tanggal 28 Mei 2024. Konfirmasi segera.',
    time:'32 menit lalu'
  },
  {
    id:3, read:true, type:'produksi',
    icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    iconBg:'background:var(--primary-green-soft);color:var(--primary-green)',
    title:'Batch B-2024-041 Selesai Diproses',
    desc:'Batch kompos padat B-2024-041 telah selesai dengan output 312 kg (efisiensi 74%). Siap untuk pengemasan.',
    time:'2 jam lalu'
  },
  {
    id:4, read:true, type:'stok',
    icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>',
    iconBg:'background:var(--primary-green-soft);color:var(--primary-green)',
    title:'Stok Pupuk Cair Diperbarui',
    desc:'Stok pupuk cair bertambah 295 liter dari batch B-2024-040. Total stok saat ini: 680 liter.',
    time:'5 jam lalu'
  },
  {
    id:5, read:true, type:'buyer',
    icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.4a16 16 0 0 0 6.29 6.29l.88-.87a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
    iconBg:'background:var(--accent-blue-soft,#E3F2FD);color:var(--accent-blue,#1976D2)',
    title:'Konfirmasi Pengiriman D-2024-027',
    desc:'PT Tani Sejahtera mengkonfirmasi penerimaan 200 liter pupuk cair (D-2024-027). Rating: 5/5.',
    time:'Kemarin, 14:20'
  },
  {
    id:6, read:true, type:'sistem',
    icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    iconBg:'background:#F3E5F5;color:#6A1B9A',
    title:'Laporan Produksi Bulanan Tersedia',
    desc:'Laporan produksi bulan April 2024 telah digenerate. Total produksi: 4.2 ton, pendapatan: Rp 35.8 juta.',
    time:'Kemarin, 09:00'
  },
];

let activeFilter = 'semua';

function renderNotifs() {
  const list = document.getElementById('notif-list');
  const filtered = NOTIFS.filter(n => {
    if (activeFilter === 'belum') return !n.read;
    if (activeFilter === 'dibaca') return n.read;
    return true;
  });

  if (filtered.length === 0) {
    list.innerHTML = `<div style="padding:var(--space-8);text-align:center;color:var(--text-muted);">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto var(--space-3);display:block;opacity:0.4;"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div style="font-size:var(--font-size-sm);">Tidak ada notifikasi</div>
    </div>`;
  } else {
    list.innerHTML = filtered.map(n => `
      <div class="notif-item ${n.read ? '' : 'unread'}" data-id="${n.id}" onclick="markRead(${n.id})">
        <div class="notif-dot-col">
          ${n.read ? '<div style="width:8px;"></div>' : '<div class="notif-unread-dot"></div>'}
        </div>
        <div class="notif-icon-col" style="${n.iconBg};">${n.icon}</div>
        <div class="notif-body">
          <div class="notif-title">${n.title}</div>
          <div class="notif-desc">${n.desc}</div>
        </div>
        <div class="notif-time-col">${n.time}</div>
      </div>`).join('');
  }

  const unreadCount = NOTIFS.filter(n => !n.read).length;
  document.getElementById('notif-count-text').textContent =
    `Menampilkan ${filtered.length} dari ${NOTIFS.length} notifikasi`;
  const badge = document.getElementById('sidebar-notif-badge');
  if (badge) badge.textContent = unreadCount > 0 ? unreadCount : '';
  if (badge) badge.style.display = unreadCount > 0 ? '' : 'none';
}

function filterNotif(btn, tab) {
  document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = tab;
  renderNotifs();
}

function markRead(id) {
  const n = NOTIFS.find(x => x.id === id);
  if (n) { n.read = true; renderNotifs(); }
}

function markAllRead() {
  NOTIFS.forEach(n => n.read = true);
  renderNotifs();
}

document.addEventListener('DOMContentLoaded', renderNotifs);
</script>
</body>
